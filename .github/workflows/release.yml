# Builds EucLink when a version tag such as v0.3.0 is pushed, and attaches a disk image
# and a zip of the app to a GitHub Release. The notes are the install steps from
# .github/release-install.md followed by that version's CHANGELOG section.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # For the build attestation: a signed record that these files were built here from this code.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: ./build.sh ci
      - name: Zip the app
        run: ditto -c -k --keepParent EucLink.app "EucLink-${GITHUB_REF_NAME}-apple-silicon.zip"
      - name: Make the disk image
        run: dmg/make.sh "EucLink-${GITHUB_REF_NAME}-apple-silicon.dmg"
      - name: Write checksums
        run: shasum -a 256 EucLink-*.dmg EucLink-*.zip > "EucLink-${GITHUB_REF_NAME}-checksums.txt"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/VERSION/${GITHUB_REF_NAME}/g" .github/release-install.md > notes.md
          {
            echo "## Verify your download"
            echo
            echo "Run \`shasum -a 256\` on the file you downloaded and compare:"
            echo
            echo '```'
            cat "EucLink-${GITHUB_REF_NAME}-checksums.txt"
            echo '```'
            echo
            echo "GitHub also keeps a signed record that these files were built from this code:"
            echo "\`gh attestation verify <file> --repo vilbht/euclink\`"
            echo
            echo "## What changed"
          } >> notes.md
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            /^## \[/ { on = 0 }
            on' CHANGELOG.md >> notes.md
          gh release create "$GITHUB_REF_NAME" \
            "EucLink-${GITHUB_REF_NAME}-apple-silicon.dmg" \
            "EucLink-${GITHUB_REF_NAME}-apple-silicon.zip" \
            "EucLink-${GITHUB_REF_NAME}-checksums.txt" \
            --title "EucLink $GITHUB_REF_NAME" --notes-file notes.md
      # Last, so a problem here cannot stop the release from being published.
      - name: Attest the build
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            EucLink-*.dmg
            EucLink-*.zip

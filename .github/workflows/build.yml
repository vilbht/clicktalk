# Compiles the app and runs the tests on every push to main and every pull request.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: ./build.sh ci
      - name: Make the disk image
        run: dmg/make.sh EucLink.dmg
      # The README's guide pictures, drawn from the real views with sample data.
      - name: Render the guide pictures
        run: EucLink.app/Contents/MacOS/EucLink --render-docs rendered
      - uses: actions/upload-artifact@v4
        with:
          name: guide-pictures
          path: rendered
          retention-days: 14
